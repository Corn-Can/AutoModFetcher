# Automatically build the project for every push and submitted pull request. This can help
# catch issues that only occur on certain platforms or Java versions, and provides a first
# line of defence against bad commits.

name: build
on: [pull_request, push]

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repository
        uses: actions/checkout@v4
      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v4
      # Forge 1.20.1 builds on a Java 17 toolchain while the other three targets build on 21.
      # The foojay resolver in settings.gradle.kts can fetch a missing JDK on its own, but a
      # download in the middle of a build is a slow and avoidable way to find that out.
      - name: setup jdk
        uses: actions/setup-java@v4
        with:
          java-version: |
            17
            21
          distribution: 'microsoft'
      # Minecraft decompilation and remapping dominate this build, and they are the same work
      # every run. Without a cache, four targets is four decompiles from cold.
      - name: setup gradle
        uses: gradle/actions/setup-gradle@v4
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew
      # buildAll, not build. Stonecutter switches the source tree between nodes, so plain
      # `build` compiles only whichever node happens to be active — which is one of four, and
      # it is the same one every time. Three of the four shipped targets were never compiled
      # here until this said buildAll.
      #
      # It is also what puts the jars where the upload step looks: buildAndCollect copies each
      # node's jar into build/libs/<mod version>/, and nothing else does.
      - name: build every target
        run: ./gradlew buildAll
      - name: capture build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Artifacts
          path: build/libs/
          if-no-files-found: error
