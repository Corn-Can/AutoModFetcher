# Every version- and loader-specific number lives here, so adding a target means adding a
# table rather than editing build scripts.

mod.id = "automodfetcher"
mod.name = "AutoModFetcher"
mod.group = "com.corncan.automodfetcher"
mod.version = "0.1.0"

deps.fabric_loader = "0.16.14"
loomx.loom_version = "1.14-SNAPSHOT"

["1.20.1"]
mod.mc_releases = ["1.20.1"]
# Resource pack format for this Minecraft version. Forge and NeoForge refuse to build a
# ResourcePackInfo for a mod jar without a pack.mcmeta, and log an error at startup for it.
mod.pack_format = "15"

[fabric."1.20.1"]
# Pinned, not a range. The login query phase this mod hooks was removed in 1.20.2, so a
# build that advertised 1.20.x would install, load, and silently do nothing.
mod.mc_compat = "1.20.1"
mod.java = ">=17"
deps.fabric_api = "0.92.11+1.20.1"

[forge."1.20.1"]
# Forge spells compatibility as a Maven range, like NeoForge.
mod.mc_compat = "[1.20.1]"
mod.java = ">=17"
# Built against the version this is actually tested on. mods.toml accepts [47,), so the jar
# still runs on any 47.x — but the build should match what was put in front of a real server.
deps.forge_loader = "1.20.1-47.4.0"

["1.21.1"]
mod.mc_releases = ["1.21.1"]
mod.pack_format = "34"

[fabric."1.21.1"]
# Pinned for the same reason the 1.20.1 build is: this jar is compiled against one set of
# names, and the only honest compatibility claim is the version it was built for.
mod.mc_compat = "1.21.1"
mod.java = ">=21"
deps.fabric_api = "0.116.15+1.21.1"

[neoforge."1.21.1"]
# NeoForge spells compatibility as a Maven range.
mod.mc_compat = "[1.21.1]"
mod.java = ">=21"
# Built against the version this is actually tested on. neoforge.mods.toml accepts
# [21.1,), so the jar still runs on any 21.1.x — but the build should match what was put
# in front of a real server. That file used to derive its range from this value, which
# made every NeoForge older than this exact build refuse to load the mod.
deps.neo_loader = "21.1.248"
