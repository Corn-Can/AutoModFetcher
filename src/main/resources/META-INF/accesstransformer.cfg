# Nothing here changes the game's behaviour. Every entry exists so this mod can read
# something the client already knows during login but does not expose. See
# automodfetcher.accesswidener for the Fabric equivalent and the reasoning.
#
# The two halves are spelled differently on purpose. NeoForge runs on Mojang's own names, so
# an entry says what the field is called. Forge 1.20.1 runs on SRG, so the same field has to
# be named f_104522_ and friends; the comment after each one is what it actually is.
#
# Stonecutter strips one leading '#' from the branch it activates, so keep prose out of the
# blocks below — an explanatory line in there would be uncommented into a syntax error.

#? if >=1.20.2 {
public net.minecraft.client.gui.screens.ConnectScreen connection
public net.minecraft.client.multiplayer.ClientHandshakePacketListenerImpl connection
#?}

#? if >=1.21 {
public net.minecraft.client.gui.screens.DisconnectedScreen details
#?}

#? if <1.20.2 {
#public net.minecraft.client.multiplayer.ClientHandshakePacketListenerImpl f_243717_ # serverData
#public net.minecraft.client.multiplayer.ClientHandshakePacketListenerImpl f_104522_ # connection
#?}

#? if <1.21 {
#public net.minecraft.client.gui.screens.DisconnectedScreen f_95988_ # reason
#?}
